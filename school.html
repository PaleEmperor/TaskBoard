<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eef4f8" />
  <title>HomeFlow School</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24323d;background:#eef4f8;--panel:#fff;--line:#dbe5eb;--accent:#5b8f29;--blue:#8fc0e9;--muted:#667782}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eef4f8,#f7fbfd 55%,#edf5ef)}
    .shell{width:min(1500px,calc(100% - 28px));margin:0 auto;padding:18px 0 36px}.tabs{display:flex;gap:8px;align-items:center;margin:0 0 14px;padding:7px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(47,70,82,.08);width:max-content}.tab{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#43535e;font-weight:800;padding:10px 16px;border-radius:13px}.tab.active{background:#273944;color:#fff}.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 48px rgba(47,70,82,.09);overflow:hidden}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding:22px 24px 16px}.eyebrow{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:#6d7e88;font-weight:900}.hero h1{margin:4px 0 0;font-size:clamp(1.55rem,3vw,2.4rem)}.week-note{color:var(--muted);font-weight:700}.today-card{padding:10px 14px;border-radius:14px;background:#eef6e8;color:#426b1e;font-weight:800}.schedule-wrap{padding:0 18px 20px;overflow:auto}.schedule{min-width:900px;display:grid;grid-template-columns:82px repeat(5,minmax(150px,1fr));grid-template-rows:58px repeat(10,38px);position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day-head{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;background:#f7fafb;padding:8px}.day-head.today{background:#eef6e8;color:#4f8123}.time{padding:8px;color:#80909a;font-weight:700;font-size:.92rem;background:#fbfcfd}.lesson{margin:3px;border-radius:9px;background:linear-gradient(180deg,#9bc9ec,#8ebbe0);border:1px solid #83afd0;padding:5px 7px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;z-index:2;box-shadow:0 2px 6px rgba(75,114,145,.12)}.lesson strong{font-size:.83rem;line-height:1.05}.lesson span{font-size:.72rem;color:#356b8b;margin-top:3px;line-height:1.1}.lesson small{font-size:.66rem;color:#527f25;margin-top:3px;line-height:1.05}.empty{color:#90a0aa;font-weight:700;padding:28px 24px;text-align:center}.mobile-day{display:none}.mobile-list{display:none}
    @media(max-width:760px){.shell{width:min(100% - 16px,1500px);padding-top:8px}.tabs{width:100%;justify-content:center;position:sticky;top:6px;z-index:20}.tab{flex:1;justify-content:center}.hero{align-items:flex-start;flex-direction:column;padding:18px}.schedule-wrap{display:none}.mobile-list{display:block;padding:0 14px 18px}.mobile-day{display:block;margin:0 0 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.mobile-day h2{font-size:1rem;margin:0;padding:12px 14px;background:#f7fafb}.mobile-day.today h2{background:#eef6e8;color:#4f8123}.mobile-lesson{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:11px 13px;border-top:1px solid #edf1f3}.mobile-lesson time{font-weight:900;color:#657681}.mobile-lesson strong{display:block}.mobile-lesson span{display:block;color:#537589;font-size:.85rem;margin-top:2px}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="tabs" aria-label="Main views">
      <a class="tab" href="./index.html">🏠 Home</a>
      <a class="tab active" href="./school.html" aria-current="page">🎒 School</a>
    </nav>
    <main class="panel">
      <header class="hero">
        <div><div class="eyebrow">Linnea · repeating weekly schedule</div><h1>School week</h1><div class="week-note" id="weekNote"></div></div>
        <div class="today-card" id="todayCard"></div>
      </header>
      <div class="schedule-wrap"><div class="schedule" id="schedule"></div></div>
      <div class="mobile-list" id="mobileList"></div>
    </main>
  </div>
<script>
(() => {
  const days=["Monday","Tuesday","Wednesday","Thursday","Friday"];
  const times=["08:00","08:45","09:00","09:45","09:55","10:40","10:55","11:40","12:10","12:55"];
  const lessons={
    Monday:[
      ["08:00","08:45","MU","Musiikki","KAT B407"],
      ["09:00","09:45","SUK","Suomen kieli ja kirjallisuus",""],
      ["09:55","10:40","SUK","Suomen kieli ja kirjallisuus",""],
      ["10:55","11:40","LI","Liikunta","KAT ETT A108_2"],
      ["12:10","12:55","LI","Liikunta","ETT A108_2"]
    ],
    Tuesday:[
      ["09:00","09:45","KS","Käsityö","KAT B203"],
      ["09:55","10:40","ENA1","Englanti, A1","KAT B203"],
      ["10:55","11:40","MA","Matematiikka",""],
      ["12:10","12:55","UEEL","Uskonto/Elämänkatsomustieto",""]
    ],
    Wednesday:[
      ["08:00","08:45","MA","Matematiikka",""],
      ["09:00","09:45","SUK","Suomen kieli ja kirjallisuus",""],
      ["09:55","10:40","SUK","Suomen kieli ja kirjallisuus",""],
      ["10:55","11:40","YM","Ympäristöoppi",""]
    ],
    Thursday:[
      ["09:00","09:45","KS","Käsityö","KAT B203"],
      ["09:55","10:40","SUK","Suomen kieli ja kirjallisuus",""],
      ["10:55","11:40","SUK","Suomen kieli ja kirjallisuus",""],
      ["12:10","12:55","KU","Kuvataide","KAT B203"]
    ],
    Friday:[
      ["09:00","09:45","SUK","Suomen kieli ja kirjallisuus",""],
      ["09:55","10:40","SUK","Suomen kieli ja kirjallisuus",""],
      ["10:55","11:40","MA","Matematiikka",""],
      ["12:10","12:55","YM","Ympäristöoppi",""]
    ]
  };
  const now=new Date();
  const dayIndex=now.getDay()-1;
  const today=dayIndex>=0&&dayIndex<5?days[dayIndex]:null;
  const monday=new Date(now); monday.setHours(12,0,0,0); monday.setDate(now.getDate()-((now.getDay()+6)%7));
  const friday=new Date(monday); friday.setDate(monday.getDate()+4);
  const fmt=d=>new Intl.DateTimeFormat("fi-FI",{day:"2-digit",month:"2-digit",year:"numeric"}).format(d);
  document.getElementById("weekNote").textContent=`${fmt(monday)} – ${fmt(friday)} · same timetable every week`;
  document.getElementById("todayCard").textContent=today?`Today: ${today}`:"No school today";
  const schedule=document.getElementById("schedule");
  const blank=document.createElement("div"); blank.className="day-head cell"; blank.style.gridColumn="1"; blank.style.gridRow="1"; schedule.appendChild(blank);
  days.forEach((day,i)=>{const el=document.createElement("div");el.className=`day-head cell${day===today?" today":""}`;el.textContent=day;el.style.gridColumn=String(i+2);el.style.gridRow="1";schedule.appendChild(el)});
  times.forEach((time,i)=>{const el=document.createElement("div");el.className="time cell";el.textContent=i%2===0?time:"";el.style.gridColumn="1";el.style.gridRow=String(i+2);schedule.appendChild(el);days.forEach((_,d)=>{const c=document.createElement("div");c.className="cell";c.style.gridColumn=String(d+2);c.style.gridRow=String(i+2);schedule.appendChild(c)})});
  const rowFor=t=>times.indexOf(t)+2;
  days.forEach((day,d)=>lessons[day].forEach(([start,end,code,name,room])=>{const el=document.createElement("div");el.className="lesson";el.style.gridColumn=String(d+2);el.style.gridRow=`${rowFor(start)} / ${rowFor(end)}`;el.innerHTML=`<strong>${code} ${name}</strong>${room?`<small>${room}</small>`:""}`;schedule.appendChild(el)}));
  const mobile=document.getElementById("mobileList");
  days.forEach(day=>{const section=document.createElement("section");section.className=`mobile-day${day===today?" today":""}`;section.innerHTML=`<h2>${day}</h2>`;lessons[day].forEach(([start,end,code,name,room])=>{section.insertAdjacentHTML("beforeend",`<div class="mobile-lesson"><time>${start}<br>${end}</time><div><strong>${code} ${name}</strong>${room?`<span>${room}</span>`:""}</div></div>`)});mobile.appendChild(section)});
})();
</script>
</body>
</html>
