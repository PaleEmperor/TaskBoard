name: Update Fuel Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-fuel-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Rovaniemi fuel data
        run: node scripts/update-fuel-data.mjs

      - name: Commit updated fuel data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel-rovaniemi.json data/fuel-geocode-cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Update fuel price data"
          git push
